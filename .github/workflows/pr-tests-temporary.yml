name: Temporary PR Tests

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check changed modules
        run: |
          for file in app/app.js app/generation-adapter.js app/ui-data.js engine/selection/domains.js engine/validation/themes.js; do node --check "$file"; done
      - name: Run direct theme tests
        run: node --test tests/app/themes-custom-2.1g.test.js tests/app/ui-data.test.js tests/validation/themes.test.js
      - name: Run related regression tests
        run: node --test --test-name-pattern="Themes|Theme" tests/selection/domains.test.js tests/prompt-building/prompt-builder.test.js tests/app/generation-integration.test.js tests/app/ui-guardrails.test.js
