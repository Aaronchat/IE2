name: Verify 2.1F

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check changed JavaScript
        run: |
          node --check app/app.js
          node --check app/generation-adapter.js
          node --check app/ui-data.js
          node --check engine/selection/clothing.js
          node --check engine/prompt-building/index.js
          node --check tests/provocative-clothing-2.1f.test.js
      - name: Run test suite
        run: find tests -name '*.test.js' -print0 | xargs -0 node --test
      - name: Run validators
        run: |
          node engine/validation/clothing.js
          node engine/validation/packages.js
