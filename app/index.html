<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinite Engine 2.1I — Prompt Builder</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./configuration-code.css">
  <script type="importmap">
  {
    "scopes": {
      "./app.js": {
        "./ui-data.js": "./ui-data-2.1i.js",
        "./generation-adapter.js": "./generation-adapter-2.1i.js",
        "./ui-guardrails.js": "./ui-guardrails-2.1h.js"
      }
    }
  }
  </script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Infinite Engine 2.1I</p>
        <h1>Prompt Builder</h1>
        <p class="subtitle">Choose manually, use Random where supported, or use None where the engine allows it.</p>
      </div>
      <div class="toolbar">
        <input id="control-search" type="search" placeholder="Search controls or options…" aria-label="Search controls or options">
        <button id="expand-all" type="button">Expand all</button>
        <button id="collapse-all" type="button">Collapse all</button>
        <button id="clear-all" type="button">Clear selections</button>
      </div>
    </header>

    <div class="layout">
      <section class="panel" id="engine-controls" aria-label="Infinite Engine controls"></section>
      <aside class="panel result-panel">
        <div class="configuration-code-entry">
          <label for="configuration-code-input">Configuration Code</label>
          <div class="configuration-code-row">
            <input id="configuration-code-input" type="text" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="Enter 10-digit code">
            <button id="configuration-code-clear" type="button">Clear code</button>
          </div>
          <p class="configuration-code-note">Enter a saved code before Generate to replay that exact generated prompt. Codes are saved on this browser.</p>
        </div>
        <div class="result-actions">
          <button id="generate-prompt" class="generate-button" type="button">Generate</button>
          <button id="copy-prompt" type="button" disabled>Copy Prompt</button>
        </div>
        <section class="generation-result" aria-live="polite">
          <h2>Generated Prompt</h2>
          <p id="seed-output" class="seed-output"></p>
          <p id="generation-error" class="generation-error" hidden></p>
          <div id="prompt-output" class="prompt-output"></div>
        </section>
        <details class="debug-state">
          <summary>Current UI state (debug)</summary>
          <div class="state-header">
            <span>Raw state</span>
            <button id="copy-state" type="button">Copy state</button>
          </div>
          <pre id="state-output"></pre>
        </details>
      </aside>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./configuration-code.js"></script>
</body>
</html>
